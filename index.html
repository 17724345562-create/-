<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>聚神阁</title>
<style>
/* 基础重置 */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f7fb; --text: #2a3142; --strong: #0f1420; --dim: #7a8399;
  --card: #ffffff; --border: rgba(15,20,35,.08); --accent: #5b7cfa;
  --accent-grad: linear-gradient(135deg, #7c93ff, #5b7cfa);
  --green: #2fa96e; --red: #e05a5a; --radius: 16px;
}
body {
  font-family: -apple-system, "PingFang SC", sans-serif; background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased; overflow: hidden; height: 100vh; height: 100dvh;
}
button { font-family: inherit; cursor: pointer; border: none; outline: none; transition: .2s; }
button:active { transform: scale(0.97); }
input, select { font-family: inherit; outline: none; }

/* 登录页 */
.login-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 1000; }
.login-screen.hide { display: none; }
.login-box { width: 100%; max-width: 340px; padding: 32px 24px; background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.05); }
.login-title { font-size: 24px; font-weight: 700; text-align: center; color: var(--accent); letter-spacing: 4px; margin-bottom: 30px; font-family: "Songti SC", serif; }
.input-group { margin-bottom: 16px; }
.input-group input { width: 100%; height: 50px; background: var(--bg); border-radius: 12px; padding: 0 16px; font-size: 15px; border: 1px solid transparent; }
.input-group input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(91,124,250,.1); }
.btn-primary { width: 100%; height: 50px; border-radius: 12px; background: var(--accent-grad); color: #fff; font-size: 15px; font-weight: 600; margin-top: 10px; }
.error-msg { color: var(--red); font-size: 13px; text-align: center; margin-bottom: 10px; display: none; }

/* 应用框架 */
.app { display: none; flex-direction: column; height: 100%; }
.app.active { display: flex; }

/* 顶部导航 */
.topbar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #fff; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-family: "Songti SC", serif; font-size: 16px; color: var(--strong); }
.logo-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--accent-grad); color: #fff; display: grid; place-items: center; font-size: 14px; }
.nav-desktop { display: flex; gap: 4px; }
.nav-item { padding: 8px 16px; border-radius: 8px; color: var(--dim); font-size: 14px; cursor: pointer; }
.nav-item:hover { background: rgba(91,124,250,.05); color: var(--text); }
.nav-item.active { background: rgba(91,124,250,.1); color: var(--accent); font-weight: 500; }
.nav-settings-mobile { display: none; color: var(--accent); font-size: 20px; cursor: pointer; margin-right: 12px; }

/* 内容区 */
.content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 40px; }
.page { display: none; max-width: 800px; margin: 0 auto; animation: fade .3s; }
.page.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(10px); } }
.card { background: #fff; border-radius: var(--radius); padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.02); border: 1px solid var(--border); margin-bottom: 16px; }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: var(--strong); font-family: "Songti SC", serif; }

/* 首页专属 */
.countdowns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
.cd-card { background: #fff; padding: 16px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; }
.cd-title { font-size: 12px; color: var(--dim); margin-bottom: 8px; }
.cd-date { font-size: 20px; font-weight: 700; color: var(--accent); }
.budget-head { display: flex; justify-content: space-between; margin-bottom: 12px; align-items: flex-end; }
.budget-num { font-size: 18px; font-weight: 600; color: var(--strong); }
.budget-pct { font-size: 22px; font-weight: 700; color: var(--accent); }
.budget-bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.budget-fill { height: 100%; background: var(--accent-grad); border-radius: 3px; transition: width .3s; }
.log-item { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.log-item:last-child { border: none; padding-bottom: 0; }
.log-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.log-time { color: var(--dim); font-size: 11px; margin-top: 4px; }

/* 资金专属 */
.fund-summary { display: flex; background: #fff; border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; margin-bottom: 16px; }
.fund-cell { flex: 1; padding: 16px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.fund-cell:last-child { border: none; }
.fund-label { font-size: 12px; color: var(--dim); }
.fund-val { font-size: 18px; font-weight: 700; color: var(--strong); }
.fund-val.blue { color: var(--accent); }
.fund-list-item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.fund-list-item:last-child { border: none; }
.fund-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.fund-icon.in { background: rgba(47,169,110,.1); color: var(--green); }
.fund-icon.out { background: rgba(224,90,90,.1); color: var(--red); }
.fund-info { flex: 1; }
.fund-name { font-size: 14px; font-weight: 500; color: var(--strong); }
.fund-time { font-size: 12px; color: var(--dim); margin-top: 2px; }
.fund-amt { font-size: 15px; font-weight: 600; }
.fund-amt.in { color: var(--green); }
.del-btn { color: var(--red); font-size: 12px; background: rgba(224,90,90,.1); padding: 4px 8px; border-radius: 6px; margin-left: 10px; }

/* 移动端底部 */
.tabbar { display: none; height: 60px; background: #fff; border-top: 1px solid var(--border); flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); }
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--dim); font-size: 10px; cursor: pointer; gap: 4px; }
.tab-item.active { color: var(--accent); }
.tab-item svg { width: 20px; height: 20px; }

/* 弹窗 */
.modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
.modal-mask.show { display: flex; }
.modal { background: #fff; width: 100%; max-width: 340px; border-radius: 20px; padding: 20px; animation: pop .2s; }
@keyframes pop { from { transform: scale(.95); opacity: 0; } }
.modal-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--strong); }
.modal-input { width: 100%; height: 44px; background: var(--bg); border: 1px solid transparent; border-radius: 10px; padding: 0 12px; margin-bottom: 12px; font-size: 14px; }
.modal-input:focus { border-color: var(--accent); background: #fff; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn-cancel { flex: 1; height: 44px; border-radius: 10px; background: var(--bg); color: var(--dim); font-size: 14px; font-weight: 600; }
.btn-save { flex: 1; height: 44px; border-radius: 10px; background: var(--accent-grad); color: #fff; font-size: 14px; font-weight: 600; }

/* 响应式 */
@media (max-width: 768px) {
  .nav-desktop { display: none; }
  .nav-settings-mobile { display: block; }
  .tabbar { display: flex; }
  .content { padding: 16px; }
  .fund-summary { flex-direction: column; }
  .fund-cell { border-right: none; border-bottom: 1px solid var(--border); }
}
</style>
</head>
<body>

<!-- 登录页 -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-title">聚神阁</div>
    <div class="error-msg" id="loginError">账号或密码错误</div>
    <div class="input-group"><input type="text" id="loginUser" placeholder="账号 (默认 admin)"></div>
    <div class="input-group"><input type="password" id="loginPwd" placeholder="密码 (默认 123456)"></div>
    <button class="btn-primary" id="loginBtn">进入</button>
  </div>
</div>

<!-- 应用主体 -->
<div class="app" id="app">
  <!-- 顶栏 -->
  <div class="topbar">
    <div class="logo"><div class="logo-icon">聚</div>聚神阁</div>
    <div class="nav-desktop">
      <div class="nav-item active" data-page="home">首页</div>
      <div class="nav-item" data-page="funds">资金</div>
      <div class="nav-item" data-page="stats">统计</div>
      <div class="nav-item" data-page="settings">设置</div>
    </div>
    <div style="display:flex; align-items:center;">
      <div class="nav-settings-mobile" data-page="settings">⚙️</div>
      <button id="logoutBtn" style="background:none; color:var(--dim); font-size:13px;">退出</button>
    </div>
  </div>

  <!-- 内容 -->
  <div class="content">
    <!-- 首页 -->
    <div class="page active" data-page="home">
      <div class="countdowns">
        <div class="cd-card" onclick="alert('演示：倒数日功能')"><div class="cd-title">项目结项</div><div class="cd-date">12/31</div></div>
        <div class="cd-card" onclick="alert('演示：倒数日功能')"><div class="cd-title">年终总结</div><div class="cd-date">12/31</div></div>
      </div>
      <div class="card">
        <div class="card-title">月度预算</div>
        <div class="budget-head">
          <div class="budget-num" id="budgetText">未设置预算</div>
          <div class="budget-pct" id="budgetPct">0%</div>
        </div>
        <div class="budget-bar"><div class="budget-fill" id="budgetFill" style="width:0%"></div></div>
      </div>
      <div class="card">
        <div class="card-title">最近动态</div>
        <div id="logs"><div style="text-align:center;color:var(--dim);padding:10px;">暂无动态</div></div>
      </div>
    </div>

    <!-- 资金 -->
    <div class="page" data-page="funds">
      <div class="fund-summary">
        <div class="fund-cell" onclick="editDeposit()">
          <div class="fund-label">总存款</div>
          <div class="fund-val blue" id="totalDep">¥0</div>
        </div>
        <div class="fund-cell">
          <div class="fund-label">今日收入</div>
          <div class="fund-val" id="todayIn" style="color:var(--green)">¥0</div>
        </div>
        <div class="fund-cell">
          <div class="fund-label">今日支出</div>
          <div class="fund-val" id="todayOut">¥0</div>
        </div>
      </div>
      <div class="card">
        <div class="card-title" style="display:flex; justify-content:space-between; align-items:center;">
          <span>资金明细</span>
          <button onclick="openRecordModal()" style="background:var(--accent); color:#fff; padding:6px 14px; border-radius:8px; font-size:13px; font-weight:500;">+ 记一笔</button>
        </div>
        <div id="fundList"><div style="text-align:center;color:var(--dim);padding:20px;">暂无记录</div></div>
      </div>
    </div>

    <!-- 统计 -->
    <div class="page" data-page="stats">
      <div class="card">
        <div class="card-title">收支对比 (本月)</div>
        <div style="font-size:14px; line-height:2;">
          <div>总收入：<span id="statIn" style="color:var(--green); font-weight:600;">¥0</span></div>
          <div>总支出：<span id="statOut" style="color:var(--red); font-weight:600;">¥0</span></div>
          <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">净结余：<span id="statNet" style="font-weight:700;">¥0</span></div>
        </div>
      </div>
    </div>

    <!-- 设置 -->
    <div class="page" data-page="settings">
      <div class="card">
        <div class="card-title">系统设置</div>
        <div style="margin-bottom:16px;">
          <div style="font-size:13px; margin-bottom:8px; color:var(--dim);">月度预算金额 (元)</div>
          <input type="number" id="setBudget" class="modal-input" placeholder="不填则取消预算">
        </div>
        <div style="margin-bottom:16px;">
          <div style="font-size:13px; margin-bottom:8px; color:var(--dim);">修改登录密码</div>
          <input type="password" id="setPwd" class="modal-input" placeholder="输入新密码 (至少6位)">
        </div>
        <button class="btn-save" id="saveSettingsBtn" style="width:100%;">保存设置</button>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="tabbar">
    <div class="tab-item active" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>首页
    </div>
    <div class="tab-item" data-page="funds">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9"/></svg>资金
    </div>
    <div class="tab-item" data-page="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3.5 20.5h17"/><rect x="5" y="12" width="3.4" height="6.5"/><rect x="10.3" y="7.5" width="3.4" height="11"/></svg>统计
    </div>
  </div>
</div>

<!-- 弹窗：记一笔 -->
<div class="modal-mask" id="modalRecord">
  <div class="modal">
    <div class="modal-title">记一笔</div>
    <select id="recType" class="modal-input">
      <option value="in">收入</option>
      <option value="out">支出</option>
    </select>
    <input type="text" id="recRemark" class="modal-input" placeholder="备注 (如: 工资)">
    <input type="number" id="recAmount" class="modal-input" placeholder="金额">
    <input type="datetime-local" id="recTime" class="modal-input">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modalRecord')">取消</button>
      <button class="btn-save" id="saveRecordBtn">保存</button>
    </div>
  </div>
</div>

<!-- 弹窗：修改总存款 -->
<div class="modal-mask" id="modalDeposit">
  <div class="modal">
    <div class="modal-title">修改总存款</div>
    <input type="number" id="inputDep" class="modal-input" placeholder="输入金额">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modalDeposit')">取消</button>
      <button class="btn-save" id="saveDepositBtn">确定</button>
    </div>
  </div>
</div>

<script>
// 安全的 DOM 获取
const $ = id => document.getElementById(id);

// 全局数据模型
let APP_DATA = {
  account: { user: 'admin', pwd: '123456' },
  baseDeposit: 0,
  records: [],
  logs: [],
  budget: null
};

// 格式化时间
function pad(n) { return n < 10 ? '0' + n : n; }
function getNowStr(d) { 
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + 
         pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); 
}

// 初始化数据
function loadData() {
  const raw = localStorage.getItem('jsg_data');
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      if (parsed.account) APP_DATA.account = parsed.account;
      if (parsed.records) APP_DATA.records = parsed.records;
      if (parsed.logs) APP_DATA.logs = parsed.logs;
      if (typeof parsed.baseDeposit === 'number') APP_DATA.baseDeposit = parsed.baseDeposit;
      if (parsed.budget !== undefined) APP_DATA.budget = parsed.budget;
    } catch(e) {}
  }
}

// 保存数据
function saveData() {
  localStorage.setItem('jsg_data', JSON.stringify(APP_DATA));
}

// 判断是否今天
function isToday(timeStr) {
  const d = new Date(timeStr.replace(/-/g, '/'));
  const t = new Date();
  return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth() && d.getDate() === t.getDate();
}

// 计算总资产
function calcTotal() {
  let total = APP_DATA.baseDeposit;
  APP_DATA.records.forEach(r => {
    if (r.type === 'in') total += Number(r.amount);
    else total -= Number(r.amount);
  });
  return Math.round(total * 100) / 100;
}

// 渲染 UI
function updateUI() {
  // 1. 计算指标
  let todayIn = 0, todayOut = 0, monthIn = 0, monthOut = 0;
  const nowM = new Date().getMonth();
  
  APP_DATA.records.forEach(r => {
    const d = new Date(r.time.replace(/-/g, '/'));
    if (d.getMonth() === nowM) {
      if (r.type === 'in') monthIn += Number(r.amount);
      else monthOut += Number(r.amount);
    }
    if (isToday(r.time)) {
      if (r.type === 'in') todayIn += Number(r.amount);
      else todayOut += Number(r.amount);
    }
  });

  // 2. 渲染文字
  $('totalDep').textContent = '¥' + calcTotal().toLocaleString();
  $('todayIn').textContent = '¥' + todayIn.toLocaleString();
  $('todayOut').textContent = '¥' + todayOut.toLocaleString();

  $('statIn').textContent = '¥' + monthIn.toLocaleString();
  $('statOut').textContent = '¥' + monthOut.toLocaleString();
  const net = monthIn - monthOut;
  $('statNet').textContent = '¥' + net.toLocaleString();
  $('statNet').style.color = net >= 0 ? 'var(--green)' : 'var(--red)';

  // 3. 预算进度
  if (APP_DATA.budget) {
    const pct = Math.min(100, Math.round((monthOut / APP_DATA.budget) * 100));
    $('budgetText').textContent = `¥${monthOut} / ¥${APP_DATA.budget}`;
    $('budgetPct').textContent = pct + '%';
    $('budgetFill').style.width = pct + '%';
    $('setBudget').value = APP_DATA.budget;
  } else {
    $('budgetText').textContent = '未设置预算';
    $('budgetPct').textContent = '0%';
    $('budgetFill').style.width = '0%';
    $('setBudget').value = '';
  }

  // 4. 渲染资金列表
  const listEl = $('fundList');
  if (APP_DATA.records.length === 0) {
    listEl.innerHTML = '<div style="text-align:center;color:var(--dim);padding:20px;">暂无记录</div>';
  } else {
    listEl.innerHTML = APP_DATA.records.map((r, i) => `
      <div class="fund-list-item">
        <div class="fund-icon ${r.type}">${r.type === 'in' ? '入' : '出'}</div>
        <div class="fund-info">
          <div class="fund-name">${r.remark}</div>
          <div class="fund-time">${r.time}</div>
        </div>
        <div class="fund-amt ${r.type}">${r.type === 'in' ? '+' : '-'} ¥${r.amount}</div>
        <button class="del-btn" onclick="deleteRecord(${i})">删</button>
      </div>
    `).join('');
  }

  // 5. 渲染日志
  const logsEl = $('logs');
  if (APP_DATA.logs.length === 0) {
    logsEl.innerHTML = '<div style="text-align:center;color:var(--dim);padding:10px;">暂无动态</div>';
  } else {
    logsEl.innerHTML = APP_DATA.logs.slice(0, 5).map(l => `
      <div class="log-item">
        <div class="log-dot"></div>
        <div><div>${l.text}</div><div class="log-time">${l.time}</div></div>
      </div>
    `).join('');
  }
}

// 登录逻辑
$('loginBtn').onclick = function() {
  const u = $('loginUser').value.trim();
  const p = $('loginPwd').value;
  if (u === APP_DATA.account.user && p === APP_DATA.account.pwd) {
    $('loginScreen').classList.add('hide');
    $('app').classList.add('active');
    updateUI();
  } else {
    $('loginError').style.display = 'block';
    setTimeout(() => $('loginError').style.display = 'none', 2000);
  }
};

// 退出
$('logoutBtn').onclick = function() {
  location.reload();
};

// 页面切换
document.querySelectorAll('.nav-item, .tab-item, .nav-settings-mobile').forEach(el => {
  el.onclick = function() {
    const page = this.dataset.page;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item, .tab-item').forEach(n => n.classList.remove('active'));
    
    document.querySelector(`.page[data-page="${page}"]`).classList.add('active');
    document.querySelectorAll(`[data-page="${page}"]`).forEach(n => n.classList.add('active'));
  };
});

// 弹窗开关
function openModal(id) { $(id).classList.add('show'); }
function closeModal(id) { $(id).classList.remove('show'); }

// 记账
function openRecordModal() {
  $('recType').value = 'in';
  $('recRemark').value = '';
  $('recAmount').value = '';
  const n = new Date();
  $('recTime').value = n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())+'T'+pad(n.getHours())+':'+pad(n.getMinutes());
  openModal('modalRecord');
}

$('saveRecordBtn').onclick = function() {
  const type = $('recType').value;
  const remark = $('recRemark').value.trim();
  const amount = parseFloat($('recAmount').value);
  const timeStr = $('recTime').value;

  if (!remark) return alert('请输入备注');
  if (isNaN(amount) || amount <= 0) return alert('请输入正确金额');
  if (!timeStr) return alert('请选择时间');

  const time = timeStr.replace('T', ' ') + ':00';
  APP_DATA.records.unshift({ type, remark, amount, time });
  APP_DATA.logs.unshift({ text: `${type === 'in' ? '收入' : '支出'}：${remark} ¥${amount}`, time });
  
  saveData();
  updateUI();
  closeModal('modalRecord');
};

function deleteRecord(index) {
  if (!confirm('确定要删除这条记录吗？')) return;
  APP_DATA.records.splice(index, 1);
  saveData();
  updateUI();
}

// 修改存款
function editDeposit() {
  $('inputDep').value = calcTotal();
  openModal('modalDeposit');
}

$('saveDepositBtn').onclick = function() {
  const val = parseFloat($('inputDep').value);
  if (isNaN(val)) return alert('请输入金额');
  
  let sum = 0;
  APP_DATA.records.forEach(r => {
    if (r.type === 'in') sum += Number(r.amount);
    else sum -= Number(r.amount);
  });
  
  APP_DATA.baseDeposit = val - sum;
  saveData();
  updateUI();
  closeModal('modalDeposit');
};

// 设置保存
$('saveSettingsBtn').onclick = function() {
  const b = parseFloat($('setBudget').value);
  APP_DATA.budget = isNaN(b) || b <= 0 ? null : b;
  
  const p = $('setPwd').value;
  if (p) {
    if (p.length < 6) return alert('密码至少 6 位');
    APP_DATA.account.pwd = p;
    alert('密码已修改，请重新登录');
    saveData();
    location.reload();
  } else {
    alert('设置已保存');
    saveData();
    updateUI();
  }
};

// 启动
window.onload = function() {
  loadData();
  // 确保登录页初始状态正确
  $('loginScreen').classList.remove('hide');
  $('app').classList.remove('active');
};
</script>
</body>
</html>

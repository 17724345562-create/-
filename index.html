<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5f7fb">
<title>聚神阁</title>
<style>
/* ================= 基础与变量 ================= */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #f5f7fb; --card: #ffffff; --text: #2a3142; --text-light: #7a8399;
  --main: #5b7cfa; --main-grad: linear-gradient(135deg, #7c93ff, #5b7cfa);
  --green: #2fa96e; --red: #e05a5a; --line: #eaedf3;
  --radius: 16px; --shadow: 0 4px 16px rgba(15,20,35,.06);
}
body { font-family: -apple-system, "PingFang SC", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
button { font-family: inherit; border: none; outline: none; cursor: pointer; transition: .2s; }
button:active { transform: scale(.96); }
input, select { font-family: inherit; outline: none; border: none; }

/* ================= 登录页 ================= */
#loginPage { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.login-box { width: 90%; max-width: 340px; background: var(--card); padding: 32px 24px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,.08); text-align: center; }
.login-title { font-size: 26px; font-weight: bold; color: var(--main); margin-bottom: 30px; letter-spacing: 2px; }
.input-box { width: 100%; height: 52px; background: var(--bg); border-radius: 14px; padding: 0 16px; margin-bottom: 16px; font-size: 15px; border: 1px solid transparent; }
.input-box:focus { border-color: var(--main); background: #fff; box-shadow: 0 0 0 3px rgba(91,124,250,.1); }
.btn-primary { width: 100%; height: 52px; background: var(--main-grad); color: #fff; border-radius: 14px; font-size: 16px; font-weight: bold; margin-top: 10px; box-shadow: 0 6px 16px rgba(91,124,250,.3); }

/* ================= 主框架 ================= */
#appPage { display: none; flex-direction: column; height: 100%; }
#appPage.active { display: flex; }

/* 顶栏 */
.header { height: 60px; background: var(--card); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--line); flex-shrink: 0; z-index: 10; }
.logo { font-size: 17px; font-weight: bold; color: var(--main); display: flex; align-items: center; gap: 8px; }
.logo-icon { width: 28px; height: 28px; background: var(--main-grad); color: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.nav-desktop { display: flex; gap: 6px; }
.nav-item { padding: 8px 16px; border-radius: 10px; color: var(--text-light); font-size: 14px; cursor: pointer; font-weight: 500; }
.nav-item.active { background: #eef2f9; color: var(--main); }
.header-right { display: flex; align-items: center; gap: 12px; }
.mobile-set { display: none; color: var(--main); font-size: 22px; cursor: pointer; margin-right: 8px; }
.avatar { width: 34px; height: 34px; background: #eef2f9; color: var(--main); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; cursor: pointer; background-size: cover; background-position: center; border: 1px solid var(--line); }
.btn-text { background: transparent; color: var(--text-light); font-size: 13px; }

/* 内容区 */
.content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 40px; }
.page { display: none; max-width: 800px; margin: 0 auto; width: 100%; }
.page.active { display: block; animation: fade .3s; }
@keyframes fade { from { opacity: 0; transform: translateY(5px); } }

/* ================= 通用组件 ================= */
.card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
.card-title { font-size: 16px; font-weight: bold; margin-bottom: 16px; color: var(--text); display: flex; justify-content: space-between; align-items: center; }
.empty-tip { text-align: center; padding: 30px 0; font-size: 14px; color: var(--text-light); }

/* ================= 首页 ================= */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.cd-card { background: var(--card); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); cursor: pointer; border: 1px solid transparent; transition: .2s; }
.cd-card:hover { border-color: var(--main); transform: translateY(-2px); }
.cd-title { font-size: 13px; color: var(--text-light); }
.cd-date { font-size: 22px; font-weight: bold; color: var(--main); margin: 6px 0; }
.cd-days { font-size: 12px; color: var(--text-light); }
.bar-bg { height: 8px; background: var(--bg); border-radius: 4px; margin: 12px 0; overflow: hidden; }
.bar-in { height: 100%; background: var(--main-grad); border-radius: 4px; transition: width .3s; }
.log-item { padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.log-item:last-child { border: none; padding-bottom: 0; }
.log-time { font-size: 12px; color: var(--text-light); margin-top: 4px; }

/* ================= 统计 ================= */
.tabs { display: flex; background: var(--bg); padding: 4px; border-radius: 10px; margin-bottom: 20px; }
.tab-btn { flex: 1; text-align: center; padding: 8px 0; font-size: 14px; color: var(--text-light); border-radius: 8px; cursor: pointer; }
.tab-btn.active { background: #fff; color: var(--main); font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,.05); }
.chart-box { display: flex; justify-content: space-around; height: 180px; align-items: flex-end; padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.chart-col { display: flex; flex-direction: column; align-items: center; width: 20%; height: 100%; justify-content: flex-end; }
.chart-bar { width: 30px; background: var(--main-grad); border-radius: 6px 6px 0 0; min-height: 4px; transition: height .3s; position: relative; }
.chart-bar.prev { background: #cbd5e1; }
.chart-val { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--text-light); }
.chart-name { margin-top: 8px; font-size: 12px; color: var(--text-light); }
.stat-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.stat-row:last-child { border: none; }
.stat-val { font-weight: bold; color: var(--text); }
.stat-diff { font-size: 12px; padding: 4px 8px; border-radius: 6px; background: var(--bg); color: var(--text-light); }
.stat-diff.up { background: rgba(47,169,110,.1); color: var(--green); }
.stat-diff.down { background: rgba(224,90,90,.1); color: var(--red); }

/* ================= 资金 ================= */
.summary { display: flex; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 16px; }
.summary-col { flex: 1; padding: 16px; border-right: 1px solid var(--line); }
.summary-col:last-child { border: none; }
.summary-title { font-size: 13px; color: var(--text-light); margin-bottom: 6px; }
.summary-val { font-size: 18px; font-weight: bold; color: var(--text); }
.summary-val.blue { color: var(--main); }
.summary-val.green { color: var(--green); }

.fund-list { margin-bottom: 20px; }
.fund-item { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--line); }
.fund-item:last-child { border: none; }
.fund-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; margin-right: 12px; flex-shrink: 0; }
.fund-icon.in { background: rgba(47,169,110,.1); color: var(--green); }
.fund-icon.out { background: rgba(224,90,90,.1); color: var(--red); }
.fund-info { flex: 1; }
.fund-name { font-size: 15px; font-weight: 500; color: var(--text); }
.fund-time { font-size: 12px; color: var(--text-light); margin-top: 4px; }
.fund-amt { font-size: 16px; font-weight: bold; }
.fund-amt.in { color: var(--green); }
.fund-del { background: rgba(224,90,90,.1); color: var(--red); padding: 6px 10px; border-radius: 8px; font-size: 12px; margin-left: 12px; }
.btn-add-record { width: 100%; height: 52px; background: var(--main-grad); color: #fff; border-radius: 14px; font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 16px rgba(91,124,250,.3); }

/* ================= 设置与数据 ================= */
.set-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border: none; }
.set-info { font-size: 15px; font-weight: 500; }
.set-desc { font-size: 12px; color: var(--text-light); margin-top: 4px; }
.set-val { font-size: 15px; color: var(--main); font-weight: bold; cursor: pointer; background: #eef2f9; padding: 6px 12px; border-radius: 8px; }
.set-btn { background: #eef2f9; color: var(--main); padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; }
.btn-danger { background: rgba(224,90,90,.1); color: var(--red); }

/* 报表 */
.report-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
.report-row:last-child { border: none; }
.report-select { background: var(--bg); padding: 8px 12px; border-radius: 8px; font-size: 14px; color: var(--text); }

/* ================= 底部导航 ================= */
.tabbar { display: none; height: 64px; background: var(--card); border-top: 1px solid var(--line); flex-shrink: 0; }
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-light); font-size: 10px; cursor: pointer; gap: 4px; transition: .2s; }
.tab-item.active { color: var(--main); font-weight: bold; }
.tab-item svg { width: 22px; height: 22px; }

/* ================= 弹窗系统 (重新设计居中留白) ================= */
.modal-bg { position: fixed; inset: 0; background: rgba(15,20,35,.4); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
.modal-bg.show { display: flex; }
.modal-box { width: 100%; max-width: 320px; background: var(--card); border-radius: 24px; padding: 24px 20px; box-shadow: 0 20px 40px rgba(0,0,0,.2); animation: pop .2s; display: flex; flex-direction: column; align-items: center; }
@keyframes pop { from { transform: scale(.95); opacity: 0; } }
.modal-title { font-size: 18px; font-weight: bold; margin-bottom: 20px; text-align: center; color: var(--text); }

/* 输入框居中且宽度收窄留白 */
.modal-input { 
  width: 88%; 
  height: 48px; 
  background: var(--bg); 
  border-radius: 12px; 
  padding: 0 12px; 
  font-size: 15px; 
  margin-bottom: 14px; 
  border: 1px solid transparent; 
  text-align: center; /* 文字居中 */
  transition: .2s;
  color: var(--text);
}
.modal-input:focus { 
  border-color: var(--main); 
  background: #fff; 
  box-shadow: 0 0 0 3px rgba(91,124,250,.1); 
}
/* 针对日期输入框的居中适配 */
.modal-input[type="datetime-local"], .modal-input[type="date"] {
  text-align: center;
  font-size: 14px; /* 稍微缩小一点防止长日期溢出 */
  padding: 0 6px;
}

/* 类型切换居中 */
.type-switch { 
  width: 88%; 
  display: flex; 
  background: var(--bg); 
  border-radius: 12px; 
  padding: 4px; 
  margin-bottom: 14px; 
}
.type-opt { flex: 1; text-align: center; padding: 10px 0; font-size: 15px; color: var(--text-light); border-radius: 8px; cursor: pointer; }
.type-opt.active { background: #fff; color: var(--main); font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,.05); }

/* 按钮宽度与输入框对齐 */
.modal-btns { width: 88%; display: flex; gap: 12px; margin-top: 10px; }
.btn-cancel { flex: 1; height: 48px; border-radius: 12px; background: var(--bg); color: var(--text-light); font-size: 15px; font-weight: bold; }
.btn-save { flex: 1; height: 48px; border-radius: 12px; background: var(--main-grad); color: #fff; font-size: 15px; font-weight: bold; }

/* 提示条 */
.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,.8); color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; opacity: 0; transition: .3s; pointer-events: none; z-index: 3000; }
.toast.show { opacity: 1; }

/* ================= 响应式 ================= */
@media (max-width: 768px) {
  .nav-desktop { display: none; }
  .mobile-set { display: block; }
  .tabbar { display: flex; }
  .content { padding: 16px; padding-bottom: 30px; }
  .summary { flex-direction: column; }
  .summary-col { border-right: none; border-bottom: 1px solid var(--line); padding: 12px 16px; }
}
</style>
</head>
<body>

<!-- 头像上传隐藏域 -->
<input type="file" id="avatarFile" accept="image/*" style="display:none">

<!-- ================= 登录页 ================= -->
<div id="loginPage">
  <div class="login-box">
    <div class="login-title">聚神阁</div>
    <input type="text" id="username" class="input-box" placeholder="请输入账号">
    <input type="password" id="password" class="input-box" placeholder="请输入密码">
    <button class="btn-primary" id="loginBtn">进入系统</button>
  </div>
</div>

<!-- ================= 主应用 ================= -->
<div id="appPage">
  
  <!-- 顶部导航 -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">聚</div>
      聚神阁
    </div>
    
    <div class="nav-desktop" id="navDesktop">
      <div class="nav-item active" data-page="home">首页</div>
      <div class="nav-item" data-page="stats">统计</div>
      <div class="nav-item" data-page="funds">资金</div>
      <div class="nav-item" data-page="report">报表</div>
      <div class="nav-item" data-page="data">数据</div>
      <div class="nav-item" data-page="settings">设置</div>
    </div>

    <div class="header-right">
      <div class="mobile-set" data-page="settings">⚙️</div>
      <div class="avatar" id="headerAvatar">管</div>
      <button class="btn-text" id="logoutBtn">退出</button>
    </div>
  </div>

  <!-- 内容区域 -->
  <div class="content">
    
    <!-- 首页 -->
    <div class="page active" data-page="home">
      <div class="grid-2" id="homeCountdowns"></div>
      <div class="card">
        <div class="card-title">月度预算</div>
        <div style="font-size:20px;font-weight:bold;margin-bottom:8px;" id="homeBudgetText">未设置</div>
        <div class="bar-bg"><div class="bar-in" id="homeBudgetBar" style="width:0%"></div></div>
      </div>
      <div class="card">
        <div class="card-title">最近动态</div>
        <div id="homeLogs"></div>
      </div>
    </div>

    <!-- 统计 -->
    <div class="page" data-page="stats">
      <div class="card">
        <div class="tabs" id="statsTabs">
          <div class="tab-btn active" data-p="today">今日</div>
          <div class="tab-btn" data-p="week">本周</div>
          <div class="tab-btn" data-p="month">本月</div>
          <div class="tab-btn" data-p="year">本年</div>
        </div>
        <div class="chart-box" id="statsChart"></div>
        <div id="statsList"></div>
      </div>
    </div>

    <!-- 资金 -->
    <div class="page" data-page="funds">
      <div class="summary">
        <div class="summary-col" onclick="openDeposit()" style="cursor:pointer">
          <div class="summary-title">总存款 (点击修改)</div>
          <div class="summary-val blue" id="uiTotal">¥0</div>
        </div>
        <div class="summary-col">
          <div class="summary-title">今日收入</div>
          <div class="summary-val green" id="uiTodayIn">¥0</div>
        </div>
        <div class="summary-col">
          <div class="summary-title">今日支出</div>
          <div class="summary-val" id="uiTodayOut">¥0</div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">资金明细</div>
        <div class="fund-list" id="fundList"></div>
        <button class="btn-add-record" onclick="openRecord()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          记一笔
        </button>
      </div>
    </div>

    <!-- 报表 -->
    <div class="page" data-page="report">
      <div class="card">
        <div class="card-title">报表生成</div>
        <div class="report-row">
          <div>选择年份</div>
          <select id="reportYear" class="report-select"></select>
        </div>
        <div class="report-row">
          <div>选择月份</div>
          <select id="reportMonth" class="report-select">
            <option value="">全年</option>
            <option value="1">1 月</option><option value="2">2 月</option><option value="3">3 月</option>
            <option value="4">4 月</option><option value="5">5 月</option><option value="6">6 月</option>
            <option value="7">7 月</option><option value="8">8 月</option><option value="9">9 月</option>
            <option value="10">10 月</option><option value="11">11 月</option><option value="12">12 月</option>
          </select>
        </div>
        <button class="btn-primary" style="margin-top: 20px;" onclick="generateReport()">生成 Word 报表</button>
      </div>
    </div>

    <!-- 数据 -->
    <div class="page" data-page="data">
      <div class="card">
        <div class="card-title">数据管理</div>
        <div class="set-row">
          <div><div class="set-info">导出备份</div><div class="set-desc">保存数据为 JSON 文件</div></div>
          <button class="set-btn" onclick="exportData()">导出</button>
        </div>
        <div class="set-row">
          <div><div class="set-info">导入数据</div><div class="set-desc">从 JSON 文件恢复（覆盖）</div></div>
          <button class="set-btn" onclick="document.getElementById('importFile').click()">导入</button>
        </div>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
      </div>
    </div>

    <!-- 设置 -->
    <div class="page" data-page="settings">
      <div class="card">
        <div class="card-title">预算与预警</div>
        <div class="set-row">
          <div><div class="set-info">今日支出阈值</div><div class="set-desc">超过时提醒</div></div>
          <div class="set-val" onclick="openSetting('warnExp')" id="uiWarnExp">未设置</div>
        </div>
        <div class="set-row">
          <div><div class="set-info">存款预警值</div><div class="set-desc">低于时提醒</div></div>
          <div class="set-val" onclick="openSetting('warnDep')" id="uiWarnDep">未设置</div>
        </div>
        <div class="set-row">
          <div><div class="set-info">月度预算</div><div class="set-desc">每月重置</div></div>
          <div class="set-val" onclick="openSetting('budget')" id="uiBudget">未设置</div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">账号信息</div>
        <div class="set-row">
          <div class="set-info">当前账号</div>
          <div class="set-val" id="uiAccount">admin</div>
        </div>
        <div class="set-row">
          <div class="set-info">登录密码</div>
          <button class="set-btn" onclick="alert('演示版本请在代码中修改默认密码')">修改</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title" style="color:var(--red)">危险操作</div>
        <div class="set-row">
          <div class="set-info" style="color:var(--red)">清空所有数据</div>
          <button class="set-btn btn-danger" onclick="clearData()">清空</button>
        </div>
      </div>
    </div>

  </div>

  <!-- 底部导航 -->
  <div class="tabbar">
    <div class="tab-item active" data-page="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.2 12 3l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>首页
    </div>
    <div class="tab-item" data-page="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3.5 20.5h17"/><rect x="5" y="12" width="3.4" height="6.5"/><rect x="10.3" y="7.5" width="3.4" height="11"/></svg>统计
    </div>
    <div class="tab-item" data-page="funds">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9"/></svg>资金
    </div>
  </div>
</div>

<!-- ================= 弹窗区域 ================= -->
<!-- 修改存款 -->
<div class="modal-bg" id="modalDeposit">
  <div class="modal-box">
    <div class="modal-title">修改总存款</div>
    <input type="number" id="inputDeposit" class="modal-input" placeholder="请输入金额">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('modalDeposit')">取消</button>
      <button class="btn-save" onclick="saveDeposit()">保存</button>
    </div>
  </div>
</div>

<!-- 修改设置 -->
<div class="modal-bg" id="modalSetting">
  <div class="modal-box">
    <div class="modal-title" id="settingTitle">修改设置</div>
    <input type="number" id="inputSetting" class="modal-input" placeholder="输入金额，留空取消">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('modalSetting')">取消</button>
      <button class="btn-save" onclick="saveSetting()">保存</button>
    </div>
  </div>
</div>

<!-- 记一笔 -->
<div class="modal-bg" id="modalRecord">
  <div class="modal-box">
    <div class="modal-title">记一笔</div>
    <div class="type-switch" id="recordTypeBox">
      <div class="type-opt active" data-type="in">收入</div>
      <div class="type-opt" data-type="out">支出</div>
    </div>
    <input type="text" id="recordRemark" class="modal-input" placeholder="备注 (如: 工资)">
    <input type="number" id="recordAmount" class="modal-input" placeholder="金额">
    <input type="datetime-local" id="recordTime" class="modal-input">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('modalRecord')">取消</button>
      <button class="btn-save" onclick="saveRecord()">保存</button>
    </div>
  </div>
</div>

<!-- 倒数日修改 -->
<div class="modal-bg" id="modalCD">
  <div class="modal-box">
    <div class="modal-title">设置倒数日</div>
    <input type="text" id="cdInputTitle" class="modal-input" placeholder="事件标题 (如: 项目结项)">
    <input type="date" id="cdInputDate" class="modal-input">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('modalCD')">取消</button>
      <button class="btn-save" onclick="saveCD()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ================= 基础配置 =================
const $ = id => document.getElementById(id);
let ACCOUNT = { user: 'admin', pwd: 'jsg@1234' };
let DATA = { base: 0, records: [], logs: [], budget: null, warnExp: null, warnDep: null, avatar: null, countdowns: [] };
let currentSettingKey = '';
let currentStatsPeriod = 'today';
let currentCDIndex = -1;

// 默认倒数日
const defaultCD = [
  { id: 1, title: '项目结项', date: '2025-12-31' },
  { id: 2, title: '年终总结', date: '2025-12-31' }
];

// 工具函数
const pad = n => n < 10 ? '0' + n : n;
const nowStr = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
function isToday(t) {
  const d = new Date(t.replace(/-/g,'/')), n = new Date();
  return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
}
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// ================= 数据存取 =================
function save() { localStorage.setItem('jsg_final_v3', JSON.stringify({ acc: ACCOUNT, d: DATA })); }
function load() {
  const raw = localStorage.getItem('jsg_final_v3');
  if (raw) {
    try {
      const p = JSON.parse(raw);
      if (p.acc) ACCOUNT = p.acc;
      if (p.d) DATA = Object.assign(DATA, p.d);
      if (!DATA.countdowns || DATA.countdowns.length === 0) DATA.countdowns = defaultCD;
    } catch(e){}
  } else {
    DATA.countdowns = defaultCD;
  }
}

// ================= 业务逻辑计算 =================
function getTotal() {
  let t = DATA.base;
  DATA.records.forEach(r => t += (r.type === 'in' ? Number(r.amt) : -Number(r.amt)));
  return Math.round(t * 100) / 100;
}

function getStats(p) {
  let curIn = 0, curOut = 0, prevIn = 0, prevOut = 0;
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const dayMs = 86400000;
  let curStart = today, curEnd = today + dayMs - 1;
  let prevStart = today - dayMs, prevEnd = today - 1;

  if (p === 'week') {
    const day = now.getDay() || 7;
    curStart = today - (day - 1) * dayMs; curEnd = curStart + 7 * dayMs - 1;
    prevStart = curStart - 7 * dayMs; prevEnd = curStart - 1;
  } else if (p === 'month') {
    curStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
    curEnd = new Date(now.getFullYear(), now.getMonth()+1, 0, 23, 59, 59).getTime();
    prevStart = new Date(now.getFullYear(), now.getMonth()-1, 1).getTime();
    prevEnd = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59).getTime();
  } else if (p === 'year') {
    curStart = new Date(now.getFullYear(), 0, 1).getTime();
    curEnd = new Date(now.getFullYear(), 11, 31, 23, 59, 59).getTime();
    prevStart = new Date(now.getFullYear()-1, 0, 1).getTime();
    prevEnd = new Date(now.getFullYear()-1, 11, 31, 23, 59, 59).getTime();
  }

  DATA.records.forEach(r => {
    const t = new Date(r.time.replace(/-/g,'/')).getTime();
    if (t >= curStart && t <= curEnd) {
      if (r.type === 'in') curIn += Number(r.amt); else curOut += Number(r.amt);
    } else if (t >= prevStart && t <= prevEnd) {
      if (r.type === 'in') prevIn += Number(r.amt); else prevOut += Number(r.amt);
    }
  });
  return { curIn, curOut, prevIn, prevOut };
}

function fmtMoney(v) { return '¥' + Number(v).toLocaleString('zh-CN', {maximumFractionDigits: 2}); }

// ================= 渲染模块 =================
function renderAll() {
  // 1. 头像
  const initial = (ACCOUNT.user || '管').charAt(0).toUpperCase();
  const av = $('headerAvatar');
  if (DATA.avatar) { av.style.backgroundImage = `url(${DATA.avatar})`; av.textContent = ''; }
  else { av.style.backgroundImage = 'none'; av.textContent = initial; }

  // 2. 资金概览
  $('uiTotal').textContent = fmtMoney(getTotal());
  const tIn = DATA.records.filter(r => r.type === 'in' && isToday(r.time)).reduce((s,r)=>s+Number(r.amt),0);
  const tOut = DATA.records.filter(r => r.type === 'out' && isToday(r.time)).reduce((s,r)=>s+Number(r.amt),0);
  $('uiTodayIn').textContent = fmtMoney(tIn);
  $('uiTodayOut').textContent = fmtMoney(tOut);

  // 3. 资金明细
  $('fundList').innerHTML = DATA.records.length ? DATA.records.map((r,i) => `
    <div class="fund-item">
      <div class="fund-icon ${r.type}">${r.type==='in'?'入':'出'}</div>
      <div class="fund-info">
        <div class="fund-name">${r.remark}</div>
        <div class="fund-time">${r.time}</div>
      </div>
      <div class="fund-amt ${r.type}">${r.type==='in'?'+':'-'} ${fmtMoney(r.amt)}</div>
      <button class="fund-del" onclick="delRecord(${i})">删</button>
    </div>
  `).join('') : '<div class="empty-tip">暂无记录，点击下方按钮记一笔</div>';

  // 4. 设置项回显
  $('uiWarnExp').textContent = DATA.warnExp ? '¥' + DATA.warnExp : '未设置';
  $('uiWarnDep').textContent = DATA.warnDep ? '¥' + DATA.warnDep : '未设置';
  $('uiBudget').textContent = DATA.budget ? '¥' + DATA.budget : '未设置';
  $('uiAccount').textContent = ACCOUNT.user;

  // 5. 首页预算
  const mOut = DATA.records.filter(r => {
    const d = new Date(r.time.replace(/-/g,'/'));
    return r.type === 'out' && d.getMonth() === new Date().getMonth();
  }).reduce((s,r)=>s+Number(r.amt),0);
  
  if (DATA.budget) {
    const pct = Math.min(100, Math.round((mOut/DATA.budget)*100));
    $('homeBudgetText').textContent = fmtMoney(mOut) + ' / ' + fmtMoney(DATA.budget);
    $('homeBudgetBar').style.width = pct + '%';
    $('homeBudgetBar').style.background = pct > 90 ? 'var(--red)' : 'var(--main-grad)';
  } else {
    $('homeBudgetText').textContent = '未设置预算';
    $('homeBudgetBar').style.width = '0%';
  }

  // 6. 首页倒数日
  $('homeCountdowns').innerHTML = DATA.countdowns.map((c, idx) => {
    const target = new Date(c.date.replace(/-/g, '/'));
    const diff = Math.ceil((target - new Date()) / (1000 * 60 * 60 * 24));
    const days = diff >= 0 ? `还剩 ${diff} 天` : `已过期 ${Math.abs(diff)} 天`;
    const color = diff < 0 ? 'var(--red)' : (diff <= 3 ? '#e89a2c' : 'var(--main)');
    return `<div class="cd-card" data-idx="${idx}">
      <div class="cd-title">${c.title}</div>
      <div class="cd-date" style="color:${color}">${c.date.slice(5).replace('-', '/')}</div>
      <div class="cd-days">${days}</div>
    </div>`;
  }).join('');

  // 为倒数日绑定点击事件
  document.querySelectorAll('.cd-card').forEach(card => {
    card.onclick = function() {
      const idx = parseInt(this.dataset.idx, 10);
      const c = DATA.countdowns[idx];
      currentCDIndex = idx;
      $('cdInputTitle').value = c.title;
      $('cdInputDate').value = c.date;
      openModal('modalCD');
    };
  });

  // 7. 首页动态
  $('homeLogs').innerHTML = DATA.logs.length ? DATA.logs.slice(0,5).map(l=>`
    <div class="log-item"><div>${l.text}</div><div class="log-time">${l.time}</div></div>
  `).join('') : '<div class="empty-tip">暂无动态</div>';

  renderStats();
}

function renderStats() {
  const s = getStats(currentStatsPeriod);
  const max = Math.max(s.curIn, s.curOut, s.prevIn, s.prevOut, 1);
  
  $('statsChart').innerHTML = `
    <div class="chart-col">
      <div class="chart-bar prev" style="height:${Math.max(4,(s.prevOut/max)*100)}%"><span class="chart-val">${s.prevOut}</span></div>
      <div class="chart-name">昨日支出</div>
    </div>
    <div class="chart-col">
      <div class="chart-bar" style="height:${Math.max(4,(s.curOut/max)*100)}%"><span class="chart-val">${s.curOut}</span></div>
      <div class="chart-name">今日支出</div>
    </div>
    <div class="chart-col">
      <div class="chart-bar prev" style="height:${Math.max(4,(s.prevIn/max)*100)}%"><span class="chart-val">${s.prevIn}</span></div>
      <div class="chart-name">昨日收入</div>
    </div>
    <div class="chart-col">
      <div class="chart-bar" style="height:${Math.max(4,(s.curIn/max)*100)}%"><span class="chart-val">${s.curIn}</span></div>
      <div class="chart-name">今日收入</div>
    </div>
  `;

  const diffOut = s.curOut - s.prevOut;
  const diffIn = s.curIn - s.prevIn;
  
  $('statsList').innerHTML = `
    <div class="stat-row">
      <div>支出对比</div>
      <div class="stat-val">${fmtMoney(s.curOut)}</div>
      <div class="stat-diff ${diffOut>0?'down':(diffOut<0?'up':'')}">${diffOut>0?'↑':(diffOut<0?'↓':'—')} ${fmtMoney(Math.abs(diffOut))}</div>
    </div>
    <div class="stat-row">
      <div>收入对比</div>
      <div class="stat-val">${fmtMoney(s.curIn)}</div>
      <div class="stat-diff ${diffIn>0?'up':(diffIn<0?'down':'')}">${diffIn>0?'↑':(diffIn<0?'↓':'—')} ${fmtMoney(Math.abs(diffIn))}</div>
    </div>
  `;
}

// ================= 事件与交互 =================
document.querySelectorAll('[data-page]').forEach(el => {
  el.onclick = () => {
    const p = el.dataset.page;
    document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
    document.querySelectorAll('.nav-item, .tab-item').forEach(n => n.classList.remove('active'));
    document.querySelector(`.page[data-page="${p}"]`).classList.add('active');
    document.querySelectorAll(`[data-page="${p}"]`).forEach(n => n.classList.add('active'));
  };
});

document.querySelectorAll('#statsTabs .tab-btn').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('#statsTabs .tab-btn').forEach(b=>b.classList.remove('active'));
    t.classList.add('active');
    currentStatsPeriod = t.dataset.p;
    renderStats();
  };
});

document.querySelectorAll('#recordTypeBox .type-opt').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('#recordTypeBox .type-opt').forEach(b=>b.classList.remove('active'));
    t.classList.add('active');
  };
});

function openModal(id) { $(id).classList.add('show'); }
function closeModal(id) { $(id).classList.remove('show'); }

window.openRecord = () => {
  $('recordRemark').value = ''; $('recordAmount').value = '';
  const n = new Date();
  $('recordTime').value = n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())+'T'+pad(n.getHours())+':'+pad(n.getMinutes());
  document.querySelectorAll('#recordTypeBox .type-opt').forEach(d => d.classList.toggle('active', d.dataset.type === 'in'));
  openModal('modalRecord');
};

window.saveRecord = () => {
  const type = document.querySelector('#recordTypeBox .type-opt.active').dataset.type;
  const remark = $('recordRemark').value.trim();
  const amt = parseFloat($('recordAmount').value);
  const time = $('recordTime').value.replace('T',' ') + ':00';
  if (!remark || !amt) return toast('请填写完整');
  
  DATA.records.unshift({ type, remark, amt, time });
  DATA.logs.unshift({ text: `${type==='in'?'收入':'支出'}: ${remark}`, time: nowStr(new Date()) });
  save(); renderAll(); closeModal('modalRecord'); toast('记录成功');
};

window.delRecord = i => {
  if (!confirm('确定要删除这条记录吗？')) return;
  DATA.records.splice(i,1); save(); renderAll();
};

window.openDeposit = () => { $('inputDeposit').value = getTotal(); openModal('modalDeposit'); };
window.saveDeposit = () => {
  const v = parseFloat($('inputDeposit').value);
  if (isNaN(v)) return;
  let sum = 0; DATA.records.forEach(r => sum += (r.type==='in'?Number(r.amt):-Number(r.amt)));
  DATA.base = v - sum;
  save(); renderAll(); closeModal('modalDeposit');
};

window.openSetting = key => {
  currentSettingKey = key;
  let val = '';
  if (key==='warnExp') val = DATA.warnExp || '';
  if (key==='warnDep') val = DATA.warnDep || '';
  if (key==='budget') val = DATA.budget || '';
  $('inputSetting').value = val;
  openModal('modalSetting');
};

window.saveSetting = () => {
  const v = parseFloat($('inputSetting').value);
  const val = isNaN(v) || v <= 0 ? null : v;
  if (currentSettingKey==='warnExp') DATA.warnExp = val;
  if (currentSettingKey==='warnDep') DATA.warnDep = val;
  if (currentSettingKey==='budget') DATA.budget = val;
  save(); renderAll(); closeModal('modalSetting');
};

window.saveCD = () => {
  const title = $('cdInputTitle').value.trim();
  const date = $('cdInputDate').value;
  if (!title || !date) return toast('请填写完整');
  if (currentCDIndex >= 0) {
    DATA.countdowns[currentCDIndex] = { ...DATA.countdowns[currentCDIndex], title, date };
    save(); renderAll(); closeModal('modalCD'); toast('倒数日已更新');
  }
};

window.clearData = () => {
  if(!confirm('⚠️ 确定清空所有数据吗？不可恢复！')) return;
  DATA = { base: 0, records: [], logs: [], budget: null, warnExp: null, warnDep: null, avatar: null, countdowns: defaultCD };
  save(); renderAll(); toast('数据已清空');
};

// 头像上传
$('headerAvatar').onclick = () => $('avatarFile').click();
$('avatarFile').onchange = function(e) {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = evt => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = 120; c.height = 120;
      const ctx = c.getContext('2d');
      const s = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, 120, 120);
      DATA.avatar = c.toDataURL('image/jpeg', 0.8);
      save(); renderAll();
    };
    img.src = evt.target.result;
  };
  r.readAsDataURL(f); e.target.value = '';
};

// 数据导入导出
window.exportData = () => {
  const blob = new Blob([JSON.stringify({ acc: ACCOUNT, d: DATA }, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '聚神阁备份.json'; a.click();
  toast('数据已导出');
};

window.importData = function(e) {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = evt => {
    try {
      const p = JSON.parse(evt.target.result);
      if (!Array.isArray(p.d.records)) throw new Error('格式错误');
      if (!confirm('导入将覆盖当前数据，确定吗？')) return;
      ACCOUNT = p.acc || ACCOUNT; DATA = p.d || DATA;
      save(); renderAll(); toast('导入成功');
    } catch(err) { toast('文件格式错误'); }
  };
  r.readAsText(f); e.target.value = '';
};

// 报表生成
function initYears() {
  const now = new Date().getFullYear();
  for(let i = now; i >= now - 5; i--) $('reportYear').innerHTML += `<option value="${i}">${i} 年</option>`;
}

window.generateReport = () => {
  const y = parseInt($('reportYear').value);
  const m = $('reportMonth').value ? parseInt($('reportMonth').value) : null;
  const records = DATA.records.filter(r => {
    const d = new Date(r.time.replace(/-/g,'/'));
    return d.getFullYear() === y && (!m || d.getMonth() + 1 === m);
  });
  if (!records.length) return toast('该时间段暂无数据');
  
  let inc = 0, exp = 0;
  records.forEach(r => r.type === 'in' ? inc += Number(r.amt) : exp += Number(r.amt));
  
  const html = `
    <html><head><meta charset="utf-8"><title>聚神阁报表</title></head><body>
    <h1>聚神阁 ${y} 年 ${m?m+' 月':'全年'} 报表</h1>
    <p>总收入：¥${inc} | 总支出：¥${exp} | 净结余：¥${inc-exp}</p>
    <table border="1" cellspacing="0" cellpadding="8" style="width:100%;border-collapse:collapse;text-align:left;">
      <tr style="background:#f0f0f0"><th>时间</th><th>类型</th><th>备注</th><th>金额</th></tr>
      ${records.map(r => `<tr><td>${r.time}</td><td>${r.type==='in'?'收入':'支出'}</td><td>${r.remark}</td><td>${r.type==='in'?'+':'-'}¥${r.amt}</td></tr>`).join('')}
    </table></body></html>
  `;
  const blob = new Blob([html], {type:'application/msword'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `报表_${y}${m?'_'+m:''}.doc`; a.click();
  toast('报表生成成功');
};

// 登录与退出
$('loginBtn').onclick = () => {
  const u = $('username').value.trim();
  const p = $('password').value;
  if (u === ACCOUNT.user && p === ACCOUNT.pwd) {
    $('loginPage').style.display = 'none';
    $('appPage').classList.add('active');
    renderAll();
  } else {
    toast('账号或密码错误');
  }
};

$('logoutBtn').onclick = () => {
  $('loginPage').style.display = 'flex';
  $('appPage').classList.remove('active');
};

// 启动
load(); initYears();
</script>
</body>
</html>
